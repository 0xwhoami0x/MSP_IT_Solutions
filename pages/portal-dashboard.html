<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Client Portal | MSP IT Solutions</title>
  <!-- Main Styles & Hermes Widget -->
  <link rel="stylesheet" href="../assets/hermes/widget.css?v=15" />
  <link rel="stylesheet" href="../assets/css/dashboard.css" />
  <script defer src="../assets/hermes/hermes.js?v=15"></script>
</head>
<body>
  <div class="dash-wrap">
    <div class="dash-top">
      <div class="welcome">
        <div class="eyebrow">Client Portal</div>
        <h1>Portal Dashboard</h1>
      </div>
      <a class="dash-signout" href="portal.html">Sign out</a>
    </div>

    <!-- Stats -->
    <div class="stat-row">
      <div class="dstat"><div class="label">Open Tickets</div><div class="value">3</div></div>
      <div class="dstat"><div class="label">Cloud Uptime</div><div class="value">99.99%</div></div>
      <div class="dstat"><div class="label">Balance Due</div><div class="value">$1,250</div></div>
      <div class="dstat"><div class="label">Assets</div><div class="value">592</div></div>
    </div>

    <!-- Main Content -->
    <div class="dash-grid">
      <div class="panel">
        <h3>Recent Activity</h3>
        <table class="tix">
          <thead><tr><th>Type</th><th>Description</th><th>Date</th></tr></thead>
          <tbody>
            <tr><td>Ticket</td><td>VPN dropping at Tacoma site</td><td>Jun 06</td></tr>
            <tr><td>Billing</td><td>Invoice #INV-992 paid</td><td>Jun 01</td></tr>
          </tbody>
        </table>
      </div>

      <div class="panel">
        <h3>Service Quick-Actions</h3>
        <div class="qa">
          <button onclick="Hermes.open()">＋ Ask Hermes Agent</button>
          <button>＋ Submit New Ticket</button>
          <button>⬇ Download SLA Report</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Hermes Agent -->
  <div id="hermes-widget-container"></div>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      Hermes.init({ container: '#hermes-widget-container', theme: 'light' });
    });
  </script>
</body>
</html>
